name: Build التارزي APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify original app HTML is present
        run: test -s www/index.html
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate app JavaScript syntax
        run: node -e "const fs=require('fs');const h=fs.readFileSync('www/index.html','utf8');const m=h.match(/<script>([\\s\\S]*?)<\\/script>/i);if(!m)throw Error('No inline script found');new Function(m[1]);console.log('JavaScript syntax OK')"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: Generate Android launcher icons
        run: |
          python -m pip install --upgrade pip
          python -m pip install cairosvg
          python - <<'PY'
          import os
          import cairosvg
          from pathlib import Path
          source = Path("www/app-icon.svg")
          if not source.is_file():
              raise SystemExit("Missing www/app-icon.svg")
          res = Path("android/app/src/main/res")
          sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          for density, size in sizes.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              for name in ("ic_launcher.png", "ic_launcher_round.png"):
                  cairosvg.svg2png(url=str(source), write_to=str(folder / name), output_width=size, output_height=size)
          # Use the generated PNG launcher icons instead of the template adaptive icons.
          adaptive = res / "mipmap-anydpi-v26"
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              path = adaptive / name
              if path.exists():
                  path.unlink()
          print("Generated launcher icons for all Android densities")
          PY
      - name: Sync web app into Android
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: al-tarzi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
