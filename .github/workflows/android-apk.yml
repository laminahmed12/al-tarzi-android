name: Build التارزي APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify original app HTML is present
        run: test -s www/index.html
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate app JavaScript syntax
        run: node -e "const fs=require('fs');const h=fs.readFileSync('www/index.html','utf8');const m=h.match(/<script>([\\s\\S]*?)<\\/script>/i);if(!m)throw Error('No inline script found');new Function(m[1]);console.log('JavaScript syntax OK')"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: Set Android version for safe updates
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          p = Path("android/app/build.gradle")
          if not p.is_file():
              raise SystemExit("Generated Android build.gradle not found")
          s = p.read_text()
          number = int(os.environ["BUILD_NUMBER"])
          s, c1 = re.subn(r'(?m)(\\bversionCode\\s+)\\d+', lambda m: m.group(1) + str(number), s, count=1)
          s, c2 = re.subn(r'(?m)(\\bversionName\\s+)[\\"\\'][^\\"\\']*[\\"\\']', lambda m: m.group(1) + '"1.0.' + str(number) + '"', s, count=1)
          if c1 != 1 or c2 != 1:
              raise SystemExit(f"Could not set Android version (versionCode={c1}, versionName={c2})")
          p.write_text(s)
          print(f"Set versionCode={number}, versionName=1.0.{number}")
          PY
      - name: Generate Android launcher icons
        run: |
          python -m pip install --upgrade pip
          python -m pip install cairosvg
          python - <<'PY'
          import os
          import cairosvg
          from pathlib import Path
          source = Path("www/app-icon.svg")
          if not source.is_file():
              raise SystemExit("Missing www/app-icon.svg")
          res = Path("android/app/src/main/res")
          sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          for density, size in sizes.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              for name in ("ic_launcher.png", "ic_launcher_round.png"):
                  cairosvg.svg2png(url=str(source), write_to=str(folder / name), output_width=size, output_height=size)
          # Use the generated PNG launcher icons instead of the template adaptive icons.
          adaptive = res / "mipmap-anydpi-v26"
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              path = adaptive / name
              if path.exists():
                  path.unlink()
          print("Generated launcher icons for all Android densities")
          PY
      - name: Add native Downloads save bridge
        run: |
          python - <<'PY'
          from pathlib import Path
          files = list(Path("android/app/src/main/java").rglob("MainActivity.java"))
          if len(files) != 1:
              raise SystemExit(f"Expected one MainActivity.java, found {len(files)}")
          p = files[0]
          s = p.read_text()
          if "class BackupBridge" in s:
              raise SystemExit("Backup bridge already exists; refusing duplicate patch")
          imports = """import android.content.ContentValues;
          import android.os.Build;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import org.json.JSONObject;
          import java.io.OutputStream;
          """
          package_end = s.find("\n")
          s = s[:package_end+1] + imports + s[package_end+1:]
          needle = "public class MainActivity extends BridgeActivity {"
          if needle not in s:
              raise SystemExit("MainActivity class declaration not found")
          addition = '''
              @Override
              public void onCreate(android.os.Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getBridge().getWebView().addJavascriptInterface(new BackupBridge(), "TarziBackup");
              }

              public class BackupBridge {
                  @JavascriptInterface
                  public String saveFile(String name, String content) {
                      JSONObject result = new JSONObject();
                      try {
                          if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                              result.put("ok", false);
                              result.put("error", "هذا الإصدار من أندرويد لا يدعم الحفظ المباشر بهذه الطريقة");
                              return result.toString();
                          }
                          String safeName = name == null ? "tarzi-backup.json" : name.replaceAll("[^A-Za-z0-9._-]", "_");
                          ContentValues values = new ContentValues();
                          values.put(MediaStore.MediaColumns.DISPLAY_NAME, safeName);
                          values.put(MediaStore.MediaColumns.MIME_TYPE, safeName.endsWith(".csv") ? "text/csv" : "application/json");
                          values.put(MediaStore.MediaColumns.RELATIVE_PATH, "Download");
                          android.net.Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                          if (uri == null) throw new java.io.IOException("تعذر إنشاء الملف في التنزيلات");
                          try (OutputStream out = getContentResolver().openOutputStream(uri)) {
                              if (out == null) throw new java.io.IOException("تعذر فتح الملف للكتابة");
                              out.write(content.getBytes(java.nio.charset.StandardCharsets.UTF_8));
                              out.flush();
                          }
                          result.put("ok", true);
                          result.put("name", safeName);
                      } catch (Exception e) {
                          String message = e.getMessage() == null ? "فشل حفظ الملف" : e.getMessage();
                          return "{\\"ok\\":false,\\"error\\":" + JSONObject.quote(message) + "}";
                      }
                      return result.toString();
                  }
              }
          '''
          s = s.replace(needle, needle + addition, 1)
          p.write_text(s)
          print(f"Installed native save bridge in {p}")
          PY
      - name: Sync web app into Android
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: al-tarzi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
